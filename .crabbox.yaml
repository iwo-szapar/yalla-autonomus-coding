profile: yalla-agent-proof

sync:
  checksum: false
  gitSeed: true
  fingerprint: true
  timeout: 15m
  warnFiles: 50000
  warnBytes: 5368709120
  failFiles: 150000
  failBytes: 21474836480
  allowLarge: false
  exclude:
    - node_modules
    - dist
    - .vercel
    - .pipeline
    - test-results
    - playwright-report
    - coverage
    - scripts/profiles/*.json
    - tests/playwright/.auth
    - tmp

env:
  allow:
    - NODE_ENV
    - CI
    - BASE_URL
    - APP_URL
    - VITE_APP_URL
